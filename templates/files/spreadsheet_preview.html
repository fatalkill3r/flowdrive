<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;padding:20px;background:#f6f7fb;color:#172033;font:13px/1.45 system-ui,sans-serif}.sheet{margin:0 0 22px;background:#fff;border:1px solid #e1e4eb;border-radius:10px;overflow:auto;box-shadow:0 2px 10px #1720330d}.sheet h2{position:sticky;left:0;margin:0;padding:12px 14px;border-bottom:1px solid #e1e4eb;font-size:14px;background:#fafbfc}.table-wrap{overflow:auto;max-height:70vh}table{border-collapse:separate;border-spacing:0;min-width:100%}td{max-width:360px;padding:8px 10px;border-right:1px solid #eceef3;border-bottom:1px solid #eceef3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}tr:first-child td{position:sticky;top:0;background:#f1f3f8;font-weight:650}td:first-child{position:sticky;left:0;background:#fafbfc}.empty{padding:40px;text-align:center;color:#697083}</style></head><body>{% for sheet in sheets %}<section class="sheet"><h2>{{ sheet.name }}</h2>{% if sheet.rows %}<div class="table-wrap"><table>{% for row in sheet.rows %}<tr>{% for cell in row %}<td title="{{ cell }}">{{ cell }}</td>{% endfor %}</tr>{% endfor %}</table></div>{% else %}<div class="empty">This worksheet is empty.</div>{% endif %}</section>{% empty %}<div class="empty">This workbook contains no worksheets.</div>{% endfor %}</body></html>
