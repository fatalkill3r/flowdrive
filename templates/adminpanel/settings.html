{% extends 'base/base.html' %}{% block content %}{% include 'adminpanel/nav.html' %}<header class="page-head"><div><h1>System settings</h1><p>Operational defaults and retention controls.</p></div></header><form method="post" class="panel settings-form">{% csrf_token %}<label><span><b>Maximum file versions</b><small>Current version included</small></span><input class="form-control" type="number" name="max_file_versions" value="{{ settings_obj.max_file_versions }}"></label><label><span><b>Trash retention days</b></span><input class="form-control" type="number" name="trash_retention_days" value="{{ settings_obj.trash_retention_days }}"></label><label><span><b>Public sharing</b></span><input type="checkbox" name="public_sharing_enabled" {% if settings_obj.public_sharing_enabled %}checked{% endif %}></label><label><span><b>Upload requests</b></span><input type="checkbox" name="upload_requests_enabled" {% if settings_obj.upload_requests_enabled %}checked{% endif %}></label><button class="btn btn-primary">Save settings</button></form>{% endblock %}
