{% if page.paginator.count %}<nav class="pagination-wrap"><span>{{ page.start_index }}–{{ page.end_index }} of {{ page.paginator.count }}</span><form method="get"><input type="hidden" name="sort" value="{{ sort }}"><input type="hidden" name="direction" value="{{ direction }}"><label>Rows <select name="per_page" onchange="this.form.submit()"><option {% if per_page == 25 %}selected{% endif %}>25</option><option {% if per_page == 50 %}selected{% endif %}>50</option><option {% if per_page == 100 %}selected{% endif %}>100</option></select></label></form><div>{% if page.has_previous %}<a href="?page={{ page.previous_page_number }}&per_page={{ per_page }}&sort={{ sort }}&direction={{ direction }}"><i class="bi bi-chevron-left"></i></a>{% endif %}<b>Page {{ page.number }} of {{ page.paginator.num_pages }}</b>{% if page.has_next %}<a href="?page={{ page.next_page_number }}&per_page={{ per_page }}&sort={{ sort }}&direction={{ direction }}"><i class="bi bi-chevron-right"></i></a>{% endif %}</div></nav>{% endif %}
