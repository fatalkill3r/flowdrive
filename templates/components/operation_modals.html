<div class="modal fade" id="renameModal"><div class="modal-dialog modal-dialog-centered"><form class="modal-content loading-form" method="post" id="renameForm">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"><div class="modal-header"><h5>Rename item</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><label class="form-label">New name</label><input class="form-control" name="name" id="renameInput" maxlength="255" required></div><div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary submit-btn">Rename</button></div></form></div></div>
<div class="modal fade" id="destinationModal"><div class="modal-dialog modal-dialog-centered"><form class="modal-content loading-form" method="post" id="destinationForm">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"><div class="modal-header"><div><h5 id="destinationTitle">Move item</h5><p>Choose a destination in your drive.</p></div><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><label class="folder-choice"><input type="radio" name="destination" value="" checked><i class="bi bi-house"></i> My Files</label><div id="folderChoices" class="folder-choices"><span class="spinner-border spinner-border-sm"></span> Loading folders…</div><label class="check-row mt-3"><input type="checkbox" name="conflict" value="keep"> Keep both if a name already exists</label></div><div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary submit-btn" id="destinationSubmit">Move here</button></div></form></div></div>
<div class="modal fade" id="shortcutsModal"><div class="modal-dialog modal-dialog-centered modal-sm"><div class="modal-content"><div class="modal-header"><h5>Keyboard shortcuts</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body shortcut-list"><div><span>Select visible items</span><kbd>Ctrl A</kbd></div><div><span>Rename</span><kbd>F2</kbd></div><div><span>Move to Trash</span><kbd>Delete</kbd></div><div><span>Open / Preview</span><kbd>Enter</kbd></div><div><span>Close</span><kbd>Esc</kbd></div></div></div></div></div>
<div class="modal fade" id="destructiveConfirmModal"><div class="modal-dialog modal-dialog-centered modal-sm"><div class="modal-content"><div class="modal-body delete-copy"><span><i class="bi bi-exclamation-triangle"></i></span><h4 id="destructiveConfirmTitle">Are you sure?</h4><p id="destructiveConfirmMessage">This action cannot be undone.</p></div><div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button><button type="button" class="btn btn-danger" id="destructiveConfirmButton">Confirm</button></div></div></div></div>
