<div class="toast-container position-fixed top-0 end-0 p-3">{% for message in messages %}<div class="toast show toast-{{ message.tags }}" role="alert"><div class="toast-body"><i class="bi {% if message.tags == 'success' %}bi-check-circle-fill{% else %}bi-exclamation-circle-fill{% endif %}"></i><span>{{ message }}</span><button class="btn-close ms-auto" data-bs-dismiss="toast"></button></div></div>{% endfor %}<div class="toast" id="liveToast"><div class="toast-body"><i class="bi bi-info-circle-fill"></i><span id="toastText"></span><button class="btn-close ms-auto" data-bs-dismiss="toast"></button></div></div></div>
