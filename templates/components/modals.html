<div class="modal fade" id="folderModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><form method="post" action="{% url 'files:create_folder' %}" class="loading-form">{% csrf_token %}<input type="hidden" name="folder_uuid" value="{{ folder.uuid|default:'' }}"><div class="modal-header"><div><h5>New folder</h5><p>Create a folder to organize your work.</p></div><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><label class="form-label">Folder name</label><input class="form-control" name="name" maxlength="255" required autofocus placeholder="e.g. Project documents"></div><div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary submit-btn">Create folder</button></div></form></div></div></div>
<div class="modal fade" id="uploadModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><div class="modal-header"><div><h5>Upload files</h5><p>Add one or multiple files to this folder.</p></div><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><form id="uploadForm" action="{% url 'files:upload' %}">{% csrf_token %}<input type="hidden" name="folder_uuid" value="{{ folder.uuid|default:'' }}"><label class="drop-zone" id="dropZone"><input type="file" name="files" id="fileInput" multiple hidden><i class="bi bi-cloud-arrow-up"></i><b>Drop files here</b><span>or click to browse your files</span></label><div id="uploadList" class="upload-list"></div><label class="form-label mt-3">If a filename already exists</label><select class="form-select" name="conflict"><option value="keep">Keep both</option><option value="replace">Replace and create a version</option></select></form></div><div class="modal-footer"><button class="btn btn-light" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" id="uploadButton" disabled>Upload files</button></div></div></div></div>
