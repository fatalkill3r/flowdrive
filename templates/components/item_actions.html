<ul class="dropdown-menu dropdown-menu-end action-menu">{% if kind == 'file' %}<li><a class="dropdown-item" href="{% url 'files:preview' item.uuid %}"><i class="bi bi-eye"></i> Preview</a></li><li><a class="dropdown-item" href="{% url 'files:download' item.uuid %}"><i class="bi bi-download"></i> Download</a></li><li><button type="button" class="dropdown-item detail-trigger" data-url="{% url 'files:details' item.uuid %}"><i class="bi bi-info-circle"></i> Details</button></li>{% else %}<li><a class="dropdown-item" href="{% url 'files:folder' item.uuid %}"><i class="bi bi-folder2-open"></i> Open</a></li>{% endif %}<li><button type="button" class="dropdown-item rename-trigger" data-action="{% url 'files:rename' kind item.uuid %}" data-name="{% if kind == 'file' %}{{ item.display_name }}{% else %}{{ item.name }}{% endif %}"><i class="bi bi-pencil"></i> Rename</button></li><li><button type="button" class="dropdown-item destination-trigger" data-mode="move" data-action="{% url 'files:move' kind item.uuid %}"><i class="bi bi-folder-symlink"></i> Move</button></li><li><button type="button" class="dropdown-item destination-trigger" data-mode="copy" data-action="{% url 'files:copy' kind item.uuid %}"><i class="bi bi-copy"></i> Copy</button></li><li><form method="post" action="{% url 'files:star' kind item.uuid %}">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"><button class="dropdown-item"><i class="bi bi-star"></i> {% if item.uuid in favorites %}Unstar{% else %}Star{% endif %}</button></form></li><li><button type="button" class="dropdown-item share-trigger" data-url="{% url 'sharing:dialog' kind item.uuid %}"><i class="bi bi-people"></i> Share</button></li><li><hr class="dropdown-divider"></li><li><button type="button" class="dropdown-item text-danger delete-trigger" data-action="{% if kind == 'file' %}{% url 'files:delete_file' item.uuid %}{% else %}{% url 'files:delete_folder' item.uuid %}{% endif %}" data-name="{% if kind == 'file' %}{{ item.display_name }}{% else %}{{ item.name }}{% endif %}"><i class="bi bi-trash3"></i> Move to Trash</button></li></ul>
