<div class="access-row"><span class="avatar">{{ share.shared_with.username|slice:':2'|upper }}</span><div><b>{{ share.shared_with.get_full_name|default:share.shared_with.username }}</b><small>{{ share.shared_with.email }}</small></div><span class="permission-pill">{{ share.get_permission_display }}</span><form class="remove-share-form" method="post" action="{% url 'sharing:remove' share.uuid %}">{% csrf_token %}<input type="hidden" name="next" value="{% url 'files:root' %}"><button class="icon-btn" title="Remove access"><i class="bi bi-x-lg"></i></button></form></div>
