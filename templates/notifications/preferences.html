{% extends 'base/base.html' %}{% block title %}Notification Preferences · {{ PRODUCT_NAME }}{% endblock %}{% block content %}<header class="page-head"><div><h1>Notification preferences</h1><p>Choose which updates appear in your notification center.</p></div></header><form method="post" class="panel settings-form">{% csrf_token %}{% for field,label in preference_fields %}{% endfor %}<label><span><b>Sharing</b><small>New shares and permission changes</small></span><input type="checkbox" name="sharing" {% if pref.sharing %}checked{% endif %}></label><label><span><b>Shared-folder activity</b><small>Uploads and version changes</small></span><input type="checkbox" name="shared_activity" {% if pref.shared_activity %}checked{% endif %}></label><label><span><b>File requests</b><small>External uploads received</small></span><input type="checkbox" name="upload_requests" {% if pref.upload_requests %}checked{% endif %}></label><label><span><b>Storage</b><small>Quota threshold warnings</small></span><input type="checkbox" name="storage" {% if pref.storage %}checked{% endif %}></label><button class="btn btn-primary">Save preferences</button></form>{% endblock %}
