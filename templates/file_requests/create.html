{% extends 'base/base.html' %}{% block title %}Create File Request · {{ PRODUCT_NAME }}{% endblock %}{% block content %}<header class="page-head"><div><h1>Create file request</h1><p>External uploaders can add files without seeing your drive.</p></div></header><form method="post" class="panel request-form">{% csrf_token %}<label class="form-label">Title<input class="form-control" name="title" maxlength="160" required placeholder="Customer documents"></label><label class="form-label">Description<textarea class="form-control" name="description" rows="3" placeholder="Tell uploaders what you need"></textarea></label><label class="form-label">Destination<select class="form-select" name="folder_uuid" required>{% for folder in folders %}<option value="{{ folder.uuid }}">{{ folder.name }}</option>{% endfor %}</select></label><label class="form-label">Expiration<select class="form-select" name="days"><option value="1">24 hours</option><option value="7" selected>7 days</option><option value="30">30 days</option><option value="0">Never</option></select></label><label class="form-label">Optional password<input class="form-control" type="password" name="password" autocomplete="new-password"></label><div><a class="btn btn-light" href="{% url 'file_requests:list' %}">Cancel</a> <button class="btn btn-primary">Create request</button></div></form>{% endblock %}
